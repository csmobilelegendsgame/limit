<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitung Mundur 7x</title>
<style>
 body{background:#121212;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;flex-direction:column}
 #circle{width:220px;height:220px;background:#00C853;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:70px;font-weight:bold;cursor:pointer;user-select:none;box-shadow:0 0 30px #00C85380;transition:0.2s}
 #circle:active{transform:scale(0.95)}
 #circle.habis{background:#555;box-shadow:none}
</style>
</head>
<body>
 <h2 id="info">Sisa: 7 / 7</h2>
 <div id="circle" onclick="klik()">7</div>
 <p style="color:gray;margin-top:25px;font-size:13px">Reset otomatis jam 9 WITA</p>
<script>
 let max = 7;
 let count = localStorage.getItem('count') ? parseInt(localStorage.getItem('count')) : max;
 let lastReset = localStorage.getItem('lastReset');

 function cekReset(){
   let nowWITA = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Makassar"}));
   let today9 = new Date(nowWITA); today9.setHours(9,0,0,0);
   if(lastReset){
     let lastWITA = new Date(new Date(lastReset).toLocaleString("en-US", {timeZone: "Asia/Makassar"}));
     if(nowWITA >= today9 && lastWITA < today9){
       count = max;
       save();
     }
   }
 }

 function save(){
   localStorage.setItem('count', count);
   localStorage.setItem('lastReset', new Date().toString());
   updateUI();
 }

 function updateUI(){
   document.getElementById('info').innerText = `Sisa: ${count} / ${max}`;
   let c = document.getElementById('circle');
   c.innerText = count > 0 ? count : 'HABIS';
   c.className = count > 0 ? '' : 'habis';
 }

 function klik(){
   cekReset();
